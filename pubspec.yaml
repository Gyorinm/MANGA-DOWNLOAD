name: maktaba
description: قارئ مانهوا يعمل دون إنترنت — بحث، تحميل كامل، ومكتبة محلية.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # الحالة
  flutter_riverpod: ^2.5.1

  # الشبكة
  dio: ^5.4.3+1

  # التخزين
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  # الواجهة
  cached_network_image: ^3.3.1
  photo_view: ^0.15.0
  google_fonts: ^6.2.1

  # الخلفية والأذونات
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
